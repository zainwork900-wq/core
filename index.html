<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Editor</title>
  <link rel="stylesheet" href="/playground/editor.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Upload Screen -->
  <div id="upload-screen">
    <div class="upload-box">
      <div class="upload-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
      </div>
      <h1>Video Editor</h1>
      <p>Drop your media files here or click to browse</p>
      <p class="upload-hint">Supports: MP4, WebM, MOV, MP3, WAV, PNG, JPG, GIF</p>
      <input type="file" id="fileInput" multiple accept="video/*,audio/*,image/*" />
      <label for="fileInput" class="upload-btn">Choose Files</label>
    </div>
  </div>

  <!-- Editor Screen -->
  <div id="editor-screen" style="display:none">
    <!-- Top Bar -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo">V</span>
        <span class="project-name" id="projectName">Untitled Project</span>
      </div>
      <div class="topbar-center">
        <button id="btn-back" title="Go to start">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button id="btn-play" title="Play">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <button id="btn-pause" title="Pause" style="display:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="btn-forward" title="Go to end">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <span id="time-display">00:00 / 00:00</span>
      </div>
      <div class="topbar-right">
        <button id="btn-add-text" title="Add text overlay">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
          Text
        </button>
        <select id="fps-select" title="Frame rate">
          <option value="24">24 FPS</option>
          <option value="30" selected>30 FPS</option>
          <option value="60">60 FPS</option>
        </select>
        <button id="btn-export" class="export-btn" title="Export video">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export
        </button>
      </div>
    </header>

    <!-- Main Area -->
    <div id="workspace">
      <!-- Left Panel -->
      <aside id="left-panel">
        <div class="panel-section">
          <div class="panel-header">
            <span>Media</span>
            <button id="btn-add-media" title="Add media files">+</button>
            <input type="file" id="mediaInput" multiple accept="video/*,audio/*,image/*" style="display:none" />
          </div>
          <div id="media-bin" class="panel-content"></div>
        </div>
        <div class="panel-section" id="props-panel" style="display:none">
          <div class="panel-header"><span>Properties</span></div>
          <div class="panel-content" id="props-content"></div>
        </div>
      </aside>

      <!-- Center -->
      <div id="center">
        <div id="player-container">
          <div id="player"></div>
          <div id="progress-overlay" style="display:none">
            <div class="progress-box">
              <h2 id="progress-text">0%</h2>
              <div class="progress-bar"><div id="progress-fill"></div></div>
              <p>Rendering... Click to cancel</p>
            </div>
          </div>
        </div>
        <div id="timeline-container">
          <div id="timeline-header">
            <span>Timeline</span>
            <div class="timeline-zoom">
              <button id="btn-zoom-out">-</button>
              <span id="zoom-level">100%</span>
              <button id="btn-zoom-in">+</button>
            </div>
          </div>
          <div id="timeline-tracks">
            <div id="track-labels">
              <div class="track-label">Video</div>
              <div class="track-label">Text</div>
              <div class="track-label">Audio</div>
            </div>
            <div id="timeline-scroll">
              <div id="timeline-ruler"></div>
              <div id="track-video" class="track video-track" data-type="video"></div>
              <div id="track-text" class="track text-track" data-type="text"></div>
              <div id="track-audio" class="track audio-track" data-type="audio"></div>
              <div id="timeline-cursor"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Text Modal -->
  <div id="text-modal" style="display:none">
    <div class="modal-box">
      <h3>Add Text Overlay</h3>
      <input type="text" id="text-input" placeholder="Type your text..." />
      <div class="text-options">
        <label>Font Size: <input type="number" id="text-size" value="48" min="8" max="200" /> px</label>
        <label>Color: <input type="color" id="text-color" value="#ffffff" /></label>
        <label>Position X: <input type="number" id="text-x" value="50" min="0" max="100" />%</label>
        <label>Position Y: <input type="number" id="text-y" value="50" min="0" max="100" />%</label>
        <label>Duration: <input type="number" id="text-duration" value="3" min="0.5" max="60" step="0.5" /> sec</label>
      </div>
      <div class="modal-actions">
        <button id="text-cancel">Cancel</button>
        <button id="text-confirm" class="primary">Add Text</button>
      </div>
    </div>
  </div>

  <!-- Export Modal -->
  <div id="export-modal" style="display:none">
    <div class="modal-box">
      <h3>Export Video</h3>
      <div class="export-options">
        <label>Format:
          <select id="export-format">
            <option value="video/webm">WebM</option>
            <option value="video/mp4">MP4</option>
          </select>
        </label>
        <label>Quality:
          <select id="export-quality">
            <option value="low">Low (Fast)</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High (Slow)</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button id="export-cancel">Cancel</button>
        <button id="export-confirm" class="primary">Start Export</button>
      </div>
    </div>
  </div>

  <script type="module" src="playground/main.ts"></script>
</body>
</html>
